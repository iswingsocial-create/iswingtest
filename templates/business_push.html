{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>{{ T.biz_push }}</h1>
  <p class="muted">{{ T.biz_push_help }}</p>
  {% if not plan_on %}<p class="warn">{{ T.biz_plan_needed }}</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if reached %}<p class="note">{{ reached }}</p>{% endif %}
  <form method="post" class="cfg-grid" id="push-form">{% csrf_token %}
    <label>{{ T.biz_purpose }}
      <select name="purpose" id="push-purpose">
        <option value="ad">{{ T.biz_purpose_ad }}</option>
        <option value="event">{{ T.biz_purpose_event }}</option>
        <option value="coupon">{{ T.biz_purpose_coupon }}</option>
      </select>
    </label>
    <div data-purpose="event" hidden>
      <label>{{ T.nav_events }}
        <select name="event"><option value="">—</option>{% for event in events %}<option value="{{ event.id }}">{{ event.title }}</option>{% endfor %}</select>
      </label>
    </div>
    <div data-purpose="coupon" hidden>
      <label>{{ T.biz_promo_code }} <input name="promo_code" maxlength="40"></label>
      <label>{{ T.biz_offer }} <textarea name="offer_details" rows="3"></textarea></label>
      <label>{{ T.biz_offer_until }} <input type="date" name="offer_ends"></label>
    </div>
    <fieldset>
      <legend>{{ T.biz_target }}</legend>
      <label class="check"><input type="checkbox" name="kind" value="single" checked> {{ T.single }}</label>
      <label class="check"><input type="checkbox" name="kind" value="couple" checked> {{ T.couple }}</label>
    </fieldset>
    <label>{{ T.city }} <input name="city" data-city="admin" required></label>
    <input type="hidden" name="lat"><input type="hidden" name="lng">
    <label>{{ T.biz_radius }} <input name="radius" value="30" inputmode="numeric"></label>
    <label>{{ T.message_label }} <textarea name="body" rows="4"></textarea></label>
    <div class="row">
      <button class="btn ghost" name="action" value="preview" type="submit">{{ T.biz_preview }}</button>
      <button class="btn" name="action" value="send" type="submit">{{ T.biz_send_push }}</button>
    </div>
  </form>
</section>
<script>
(function () {
  var select = document.getElementById("push-purpose");
  function sync() {
    var value = select ? select.value : "ad";
    document.querySelectorAll("#push-form [data-purpose]").forEach(function (node) {
      node.hidden = node.getAttribute("data-purpose") !== value;
    });
  }
  if (select) select.addEventListener("change", sync);
  sync();
})();
</script>
{% endblock %}
