{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>{{ T.biz_signup }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="cfg-grid">{% csrf_token %}
    <label>{{ T.email }} <input type="email" name="email" required></label>
    <label>{{ T.password }} <span class="pw-wrap"><input type="password" name="password" minlength="10" required>{% include "_pw_eye.html" %}</span></label>
    <label>{{ T.biz_name }} <input name="name" maxlength="40" required></label>
    <label>{{ T.kind }}
      <select name="category">{% for code, label in categories %}<option value="{{ code }}">{{ label }}</option>{% endfor %}</select>
    </label>
    <label>{{ T.city }} <input name="city" data-city="admin" autocomplete="off"></label>
    <input type="hidden" name="lat"><input type="hidden" name="lng"><input type="hidden" name="country">
    <label>{{ T.biz_address }} <input name="address" maxlength="160"></label>
    <label>{{ T.biz_desc }} <textarea name="description" rows="4"></textarea></label>
    <label>{{ T.biz_website }} <input name="website" maxlength="200"></label>
    <label>{{ T.biz_tickets }} <input name="ticket_url" maxlength="200"></label>
    <label class="check"><input type="checkbox" name="accept" required> {{ T.terms }}</label>
    <button class="btn" type="submit">{{ T.register }}</button>
  </form>
</section>
{% endblock %}
