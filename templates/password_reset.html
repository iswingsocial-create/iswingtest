{% extends "base.html" %}
{% block content %}
{% if sent %}
<section class="card">
  <h1>{{ T.reset_title }}</h1>
  <p>{{ T.reset_sent }}</p>
</section>
{% else %}
<form class="card" method="post">{% csrf_token %}
  <h1>{{ T.reset_title }}</h1>
  <label>{{ T.email }} <input type="email" name="email" required></label>
  <button class="btn">{{ T.reset_send }}</button>
</form>
{% endif %}
{% endblock %}
