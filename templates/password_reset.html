{% extends "base.html" %}
{% block content %}
{% if sent %}
<div class="card">
  <h1>{{ T.reset_title }}</h1>
  <p>{{ T.reset_sent }}</p>
  {% if dev_link %}<p><a href="{{ dev_link }}">{{ dev_link }}</a></p>{% endif %}
</div>
{% else %}
<form class="card" method="post">{% csrf_token %}
  <h1>{{ T.reset_title }}</h1>
  <label>{{ T.email }} <input type="email" name="email" required></label>
  <button class="btn">{{ T.reset_send }}</button>
</form>
{% endif %}
{% endblock %}
