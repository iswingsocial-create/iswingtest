{% extends "base.html" %}
{% block content %}
<form class="card" method="post">{% csrf_token %}
  <h1>{{ T.new_password }}</h1>
  {% if error %}<p class="error">{{ T.password_short }}</p>{% endif %}
  <label>{{ T.password }} <input type="password" name="password" minlength="10" required></label>
  <button class="btn">{{ T.save }}</button>
</form>
{% endblock %}
